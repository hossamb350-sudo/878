<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    
    <!-- Gold Gradient for Borders & Calligraphy -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Elegant Gold Star/Ring (8-point Islamic Star template) -->
  <g transform="translate(250, 250)">
    <!-- Outer Decorative Dots -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 15" opacity="0.6"/>
    
    <!-- Second Ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- Outer Octagram (Islamic Geometric Silhouette) -->
    <path d="M 0 -195 L 57 -138 L 138 -138 L 138 -57 L 195 0 L 138 57 L 138 138 L 57 138 L 0 195 L -57 138 L -138 138 L -138 57 L -195 0 L -138 -57 L -138 -138 L -57 -138 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />

    <!-- Inner gold ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#goldGrad)" stroke-dasharray="4 6" stroke-width="2" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Core Islamic Arch/Dome Design -->
    <path d="M -70 60 L -70 -20 C -70 -70 0 -100 0 -100 C 0 -100 70 -70 70 -20 L 70 60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />
    
    <!-- Quran book symbol in the center -->
    <path d="M -45 25 C -25 20 0 35 0 35 C 0 35 25 20 45 25 L 40 45 C 20 40 0 55 0 55 C 0 55 -20 40 -40 45 Z" fill="url(#goldGrad)" />
    <line x1="0" y1="35" x2="0" y2="55" stroke="#064e3b" stroke-width="2" />

    <!-- Text: منصة تعز -->
    <text x="0" y="-30" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">منصة تعز</text>
    <text x="0" y="5" font-family="'Inter', system-ui, sans-serif" font-weight="bold" font-size="12" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">التنمية الثقافية</text>
  </g>
</svg>
