name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android debug.keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          sed -i 's/jcenter()/mavenCentral()/g' node_modules/@southdevs/capacitor-google-auth/android/build.gradle

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix and Regenerate Gradle Wrapper
        run: |
          # Create a temporary empty gradle project to generate clean wrapper files
          mkdir temp_gradle
          cd temp_gradle
          touch build.gradle
          gradle wrapper --gradle-version 8.2.1
          cd ..
          # Sync the valid wrapper files into the android directory
          mkdir -p android/gradle/wrapper
          cp temp_gradle/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          cp temp_gradle/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/
          cp temp_gradle/gradlew android/
          chmod +x android/gradlew
          # Clean up
          rm -rf temp_gradle

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug

      - name: Print SHA-1 fingerprint
        working-directory: ./android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
