name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Android debug.keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          sed -i 's/jcenter()/mavenCentral()/g' node_modules/@southdevs/capacitor-google-auth/android/build.gradle

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: |
          # Remove existing wrapper to fix potential corruption and ensure fresh generation
          rm -rf gradle/wrapper
          # Use Gradle 8.13 as required by AGP 8.13.0
          gradle wrapper --gradle-version 8.13
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Print SHA-1 fingerprint
        working-directory: ./android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
