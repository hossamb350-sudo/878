name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android debug.keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          sed -i 's/jcenter()/mavenCentral()/g' node_modules/@southdevs/capacitor-google-auth/android/build.gradle

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cleanup and Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          wrapper-validation-enabled: false
          dependency-graph: disabled

      - name: Build APK
        working-directory: ./android
        run: |
          # Ensure we use the specified Gradle version from the runner, not the local wrapper if it's corrupted
          gradle assembleDebug --no-daemon --stacktrace

      - name: Print SHA-1 fingerprint
        working-directory: ./android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
