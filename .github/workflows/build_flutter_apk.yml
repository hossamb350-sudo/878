name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
          cache: true

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Generate Flutter Android platform files if missing
        working-directory: ./mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Flutter Android project scaffolding..."
            flutter create . --platforms=android --org=com.taizmedia.app
          fi

      - name: Install Flutter packages
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taiz_Media_Flutter_Release_APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
